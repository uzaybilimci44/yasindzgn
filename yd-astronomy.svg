<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">YD Astronomy</title>
  <desc id="description">A YD monogram beneath a starry sky, surrounded by planets and orbital paths.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset=".52" stop-color="#111b3b"/>
      <stop offset="1" stop-color="#241747"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop offset="0" stop-color="#7557bf" stop-opacity=".42"/>
      <stop offset="1" stop-color="#7557bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".48" stop-color="#f6c96b"/>
      <stop offset="1" stop-color="#e89b56"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1efff"/>
      <stop offset="1" stop-color="#5ca9ee"/>
    </linearGradient>
    <radialGradient id="planet">
      <stop offset="0" stop-color="#ffc995"/>
      <stop offset=".72" stop-color="#e88979"/>
      <stop offset="1" stop-color="#8f4d83"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#space)"/>
  <ellipse cx="355" cy="210" rx="430" ry="300" fill="url(#nebula)"/>
  <ellipse cx="1010" cy="410" rx="360" ry="210" fill="url(#nebula)" opacity=".55"/>

  <g fill="#e8f5ff">
    <circle cx="76" cy="76" r="2"/><circle cx="145" cy="328" r="1.7"/>
    <circle cx="225" cy="92" r="1.5"/><circle cx="312" cy="46" r="2"/>
    <circle cx="424" cy="356" r="1.4"/><circle cx="511" cy="82" r="1.7"/>
    <circle cx="592" cy="382" r="2"/><circle cx="684" cy="66" r="1.5"/>
    <circle cx="786" cy="359" r="1.7"/><circle cx="864" cy="55" r="2"/>
    <circle cx="972" cy="111" r="1.4"/><circle cx="1095" cy="78" r="1.8"/>
    <circle cx="1132" cy="307" r="1.6"/><circle cx="1030" cy="365" r="1.4"/>
    <circle cx="62" cy="220" r="1.3"/><circle cx="741" cy="128" r="1.2"/>
    <circle cx="553" cy="272" r="1.2"/><circle cx="899" cy="283" r="1.5"/>
  </g>

  <g fill="#f8d995" filter="url(#glow)">
    <path d="M183 150v12m-6-6h12" stroke="#f8d995" stroke-width="1.5"/>
    <path d="M475 178v10m-5-5h10" stroke="#f8d995" stroke-width="1.3"/>
    <path d="M1070 194v12m-6-6h12" stroke="#f8d995" stroke-width="1.5"/>
    <path d="M929 343v9m-4.5-4.5h9" stroke="#f8d995" stroke-width="1.2"/>
  </g>

  <g fill="none" stroke="#9bb9ef" stroke-opacity=".5">
    <ellipse cx="300" cy="220" rx="205" ry="76" transform="rotate(-23 300 220)" stroke-width="1.4"/>
    <ellipse cx="300" cy="220" rx="166" ry="112" transform="rotate(31 300 220)" stroke-width="1"/>
  </g>
  <circle cx="300" cy="220" r="42" fill="url(#planet)"/>
  <path d="M262 229c20-12 54-17 76-5M274 191c15 8 31 9 49 2M273 249c18-8 39-9 58-2" fill="none" stroke="#ffd6aa" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="300" cy="220" rx="73" ry="23" transform="rotate(-23 300 220)" fill="none" stroke="#e9c5ff" stroke-width="5" stroke-opacity=".8"/>
  <circle cx="120" cy="279" r="12" fill="url(#cyan)"/>
  <circle cx="435" cy="153" r="9" fill="#b5a7ff"/>
  <circle cx="353" cy="325" r="6" fill="#ffd47f"/>

  <path d="M552 84v272" stroke="#b9c9ed" stroke-opacity=".28"/>
  <text x="620" y="235" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="154" font-weight="700" letter-spacing="9">YD</text>
  <path d="M632 270h322" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  <text x="635" y="316" fill="#c6d6f5" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="7">ASTRONOMY</text>
  <text x="636" y="350" fill="#94a9d0" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">A JOURNEY THROUGH THE COSMOS</text>
</svg>
